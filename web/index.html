<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  
  <!-- For Google Search -->
  <meta name="description" content="Rizznight rasmiy sayti - Toshkentdagi yugurish jamoasi. Navbatdagi yugurishlar uchun slot band qiling va jamoaga qo'shiling.">

  <!-- For Telegram, WhatsApp, and Instagram Previews (The Fix!) -->
  <meta property="og:title" content="Rizznight | We don't run. We rave.">
  <meta property="og:description" content="Rizznight rasmiy sayti - Toshkentdagi yugurish jamoasi. Navbatdagi yugurishlar uchun slot band qiling va jamoaga qo'shiling.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://rizznight.uz">
  <meta property="og:image" content="">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Rizznight">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2" />

  <!-- Cleaned up Title -->
  <title>Rizznight</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
<style>
  #loading {
    position: fixed;
    inset: 0;
    background: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    font-family: sans-serif;
  }
  #loading-logo {
    color: #FF00FF;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 6px;
  }
  #loading-motto {
    color: #888888;
    font-size: 11px;
    letter-spacing: 3px;
    margin-top: 12px;
  }
  #loading-dot {
    width: 4px;
    height: 4px;
    background: #FF00FF;
    border-radius: 50%;
    margin-top: 40px;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.5); }
  }
</style>

<div id="loading">
  <div id="loading-logo">✦ RIZZNIGHT</div>
  <div id="loading-motto">WE DON'T RUN. WE RAVE.</div>
  <div id="loading-dot"></div>
</div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

<script>
  window.addEventListener('flutter-first-frame', function() {
    var loading = document.getElementById('loading');
    if (loading) {
      loading.style.opacity = '0';
      loading.style.transition = 'opacity 0.4s ease';
      setTimeout(function() { loading.remove(); }, 400);
    }
  });
</script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (let registration of registrations) {
          registration.update();
        }
      });
    });
  }
</script>
</body>

</html>
